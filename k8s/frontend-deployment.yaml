apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 753397112861.dkr.ecr.us-east-1.amazonaws.com/frontend:c1ee68d0e19372974dbefec47d471ca633815ee4
          ports:
            - containerPort: 80