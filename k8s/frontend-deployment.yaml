apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 753397112861.dkr.ecr.us-east-1.amazonaws.com/frontend:ba936bb8c995f8720acf7bd097feff3ae2e411a8
          ports:
            - containerPort: 80